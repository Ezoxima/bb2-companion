<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>BB2 Redux – compagnon</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c1c1c; --muted:#666; --line:#e2e2e6; --accent:#2457d6; --ok:#0a7a2f; --ko:#b00020; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --card:#20232a; --ink:#ececec; --muted:#a0a4ad; --line:#333843; --accent:#7ba3ff; --ok:#5fd88a; --ko:#ff7a8e; --warn:#e8b254; }
  }
  * { box-sizing: border-box; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  nav { display: flex; max-width: 900px; margin: 0 auto; }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; padding: 12px 4px; min-height: 48px; border-bottom: 3px solid transparent; }
  nav button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 900px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 1.2rem; margin: 4px 0 10px; } h2 { font-size: 1.05rem; margin: 16px 0 6px; } h3 { font-size: .95rem; margin: 12px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bar > * { flex: 1 1 130px; }
  input, select, button.btn { font: inherit; padding: 10px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  button.btn { cursor: pointer; } button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  label.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  label.chk input { min-height: 0; width: 20px; height: 20px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 48px; }
  .row:last-child { border-bottom: 0; }
  .row .main { flex: 1; min-width: 0; } .row .sub { color: var(--muted); font-size: .8rem; }
  .num { color: var(--muted); width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .mark { width: 2.2em; text-align: center; font-weight: 700; }
  .mark.save, .ok { color: var(--ok); } .mark.manual { color: var(--warn); } .mark.miss, .ko { color: var(--ko); }
  .muted { color: var(--muted); font-size: .85rem; } .warn { color: var(--warn); }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: .78rem; margin-right: 4px; }
  .prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; } .prog i { display: block; height: 100%; background: var(--ok); }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; } td.r, th.r { text-align: right; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: var(--card); color: var(--ink); font: inherit; padding: 10px 4px; min-height: 44px; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  #detail { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; display: none; }
  #detail.open { display: block; } #detail .inner { max-width: 900px; margin: 0 auto; padding: 12px; }
  a.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  details summary { cursor: pointer; padding: 8px 0; min-height: 44px; }
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .grid6 label { font-size: .75rem; color: var(--muted); text-align: center; }
  .grid6 input { width: 100%; padding: 8px 2px; text-align: center; }
  .field { display: block; margin-bottom: 8px; } .field > span { display: block; font-size: .85rem; color: var(--muted); }
  .field input, .field select { width: 100%; }
</style>

<script>
// Logique du MVP : lecture d'une sauvegarde B2W2 (.dsv DraStic ou .sav brut).
// Même code dans Node (tests) et dans le navigateur (page). Port de poc/read_dsv.py.
(function (root) {
  "use strict";

  const SAV_SIZE = 0x80000;
  const PARTY = 0x18E00, BOXES = 0x400, BOX_SIZE = 0x1000, TRAINER = 0x19400;
  const DEX_CAUGHT = 0x21408, DEX_BYTES = 0x54;
  const ORDERS = ["ABCD","ABDC","ACBD","ACDB","ADBC","ADCB","BACD","BADC","BCAD","BCDA","BDAC","BDCA",
                  "CABD","CADB","CBAD","CBDA","CDAB","CDBA","DABC","DACB","DBAC","DBCA","DCAB","DCBA"];
  const NATURES = ["Hardi","Solo","Brave","Rigide","Mauvais","Assuré","Docile","Relax","Malin","Lâche",
                   "Timide","Pressé","Sérieux","Jovial","Naïf","Modeste","Doux","Discret","Pudique","Foufou",
                   "Calme","Gentil","Malpoli","Prudent","Bizarre"];
  // Ordre des IVs dans le fichier : PV, Atq, Déf, Vit, AtqS, DéfS
  const STAT_KEYS = ["pv", "atq", "def", "vit", "atqs", "defs"];

  function crypt(data, seed) {
    const out = new Uint8Array(data.length);
    const dv = new DataView(data.buffer, data.byteOffset, data.length);
    const ov = new DataView(out.buffer);
    for (let i = 0; i < data.length; i += 2) {
      seed = (Math.imul(seed, 0x41C64E6D) + 0x6073) >>> 0;
      ov.setUint16(i, dv.getUint16(i, true) ^ (seed >>> 16), true);
    }
    return out;
  }

  function decodePk(pk) {
    const dv = new DataView(pk.buffer, pk.byteOffset, pk.length);
    const pid = dv.getUint32(0, true), chk = dv.getUint16(6, true);
    const body = crypt(pk.subarray(8, 136), chk);
    const order = ORDERS[((pid >>> 13) & 31) % 24];
    const d = new Uint8Array(pk.length);
    d.set(pk.subarray(0, 8), 0);
    for (let i = 0; i < 4; i++) {
      const b = order.indexOf("ABCD"[i]);
      d.set(body.subarray(b * 32, b * 32 + 32), 8 + i * 32);
    }
    if (pk.length > 136) d.set(crypt(pk.subarray(136, 220), pid), 136);
    const dd = new DataView(d.buffer);
    let sum = 0;
    for (let i = 8; i < 136; i += 2) sum = (sum + dd.getUint16(i, true)) & 0xFFFF;
    return { d, dd, checksumOk: sum === chk };
  }

  function utf16(d, off, len) {
    let s = "";
    for (let i = 0; i < len; i += 2) {
      const c = d[off + i] | (d[off + i + 1] << 8);
      if (c === 0xFFFF || c === 0) break;
      s += String.fromCharCode(c);
    }
    return s;
  }

  function summarize(pk) {
    const { d, dd, checksumOk } = decodePk(pk);
    const ivw = dd.getUint32(0x38, true);
    const ivs = {};
    STAT_KEYS.forEach((k, i) => { ivs[k] = (ivw >>> (5 * i)) & 31; });
    const p = {
      species: dd.getUint16(0x08, true),
      nickname: utf16(d, 0x48, 22),
      nature: d[0x41],
      natureName: d[0x41] < NATURES.length ? NATURES[d[0x41]] : "?",
      ivs, checksumOk,
    };
    if (pk.length > 136) {
      p.level = d[0x8C];
      const s = [0x8E, 0x90, 0x92, 0x94, 0x96, 0x98, 0x9A].map((o) => dd.getUint16(o, true));
      p.stats = { pv: s[1], atq: s[2], def: s[3], vit: s[4], atqs: s[5], defs: s[6] };
    }
    return p;
  }

  const isEmpty = (b) => b.every((x) => x === 0);

  // bytes : Uint8Array du fichier. Lève une Error au message clair si le fichier est inutilisable.
  function parseSave(bytes) {
    if (bytes.length < SAV_SIZE) {
      throw new Error(`Fichier trop court (${bytes.length} octets, 524 288 attendus) : ce n'est pas une sauvegarde B2W2.`);
    }
    const sav = bytes.subarray(0, SAV_SIZE); // coupe le pied de page DeSmuME (122 octets)
    const sv = new DataView(sav.buffer, sav.byteOffset, sav.length);

    const caught = [];
    for (let i = 0; i < DEX_BYTES * 8; i++) {
      if ((sav[DEX_CAUGHT + (i >> 3)] >> (i & 7)) & 1) caught.push(i + 1);
    }

    const count = sv.getUint32(PARTY + 4, true);
    if (count > 6) throw new Error(`Équipe illisible (${count} Pokémon) : mauvais fichier ou sauvegarde corrompue.`);
    const party = [];
    for (let i = 0; i < count; i++) {
      const o = PARTY + 8 + i * 220;
      party.push(summarize(sav.subarray(o, o + 220)));
    }

    const boxes = [];
    for (let b = 0; b < 24; b++) {
      for (let s = 0; s < 30; s++) {
        const o = BOXES + b * BOX_SIZE + s * 136;
        const pk = sav.subarray(o, o + 136);
        if (isEmpty(pk.subarray(0, 8))) continue;
        boxes.push(Object.assign({ box: b + 1, slot: s + 1 }, summarize(pk)));
      }
    }

    return {
      size: bytes.length,
      trainer: utf16(sav, TRAINER + 4, 16),
      caught, party, boxes,
      invalid: party.concat(boxes).filter((p) => !p.checksumOk).length,
    };
  }

  const api = { parseSave, NATURES, STAT_KEYS };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.BB2 = api;
})(typeof self !== "undefined" ? self : this);

</script>
<script>
// Logique de la page MVP : recherche, filtres, saisons, captures, corrections manuelles.
// Fonctions pures, sans accès au DOM : même code dans Node (tests) et dans le navigateur.
(function (root) {
  "use strict";

  const SEASONS = ["Spring", "Summer", "Autumn", "Winter"];
  const SEASON_FR = { Spring: "Printemps", Summer: "Été", Autumn: "Automne", Winter: "Hiver" };
  const STAT_LABELS = ["PV", "Atq", "Déf", "AtqS", "DéfS", "Vit"]; // ordre des stats dans les données
  const METHOD_FR = {
    Grass: "Hautes herbes", Surf: "Surf", Fish: "Pêche", Cave: "Grotte", Sand: "Sable", Floor: "Sol",
    Rooms: "Salles", Swamps: "Marais", Bridge: "Pont", Sewer: "Égouts", Roof: "Toit",
    "Special Event": "Événement", "Special Gifts": "Cadeaux",
  };

  // Minuscules, sans accents ni ligatures, apostrophes unifiées : « Pokémon » trouve « pokemon ».
  function normalize(s) {
    return String(s).toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[’‘`]/g, "'")
      .normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
  }

  // Les saisons de B2W2 suivent le mois de l'horloge : janvier, mai et septembre = printemps, etc.
  function seasonForDate(date) {
    return SEASONS[date.getMonth() % 4];
  }

  // --- Captures -------------------------------------------------------------------------------
  // save : { caught: [numéros] } ou null ; manual : { "numéro": true | false }.
  // Règle : drapeau du jeu OU case cochée ; une correction « non capturé » force l'absence.
  function captureInfo(id, save, manual) {
    const inGame = !!(save && save.caught && save.caught.includes(id));
    const m = manual ? manual[id] : undefined;
    if (m === false) return { caught: false, origin: "manual", inGame };
    if (inGame) return { caught: true, origin: "save", inGame };
    if (m === true) return { caught: true, origin: "manual", inGame };
    return { caught: false, origin: "none", inGame };
  }

  // state : "auto" | "caught" | "missing". Renvoie une nouvelle table sans modifier l'ancienne.
  function setManual(manual, id, state) {
    const next = Object.assign({}, manual);
    if (state === "caught") next[id] = true;
    else if (state === "missing") next[id] = false;
    else delete next[id];
    return next;
  }

  function manualState(manual, id) {
    const m = manual ? manual[id] : undefined;
    return m === true ? "caught" : m === false ? "missing" : "auto";
  }

  // --- Pokédex ----------------------------------------------------------------------------------
  // opts : { query, type, caught: "all" | "caught" | "missing", sort: "id" | "total" | 0..5, desc }
  function filterSpecies(species, opts, isCaught) {
    const q = normalize(opts.query || "");
    let list = species.filter((s) => {
      if (q && !(normalize(s.fr).includes(q) || normalize(s.en).includes(q) || String(s.id) === q)) return false;
      if (opts.type && !s.types.includes(opts.type)) return false;
      if (opts.caught === "caught" && !isCaught(s.id)) return false;
      if (opts.caught === "missing" && isCaught(s.id)) return false;
      return true;
    });
    const sort = opts.sort === undefined || opts.sort === "id" ? "id" : opts.sort;
    const key = (s) => (sort === "id" ? s.id : sort === "total" ? s.total : s.stats[sort]);
    list = list.slice().sort((a, b) => (key(a) - key(b)) || (a.id - b.id));
    if (opts.desc) list.reverse();
    return list;
  }

  // --- Zones ------------------------------------------------------------------------------------
  const sectionVisible = (sec, showSpoilers) => showSpoilers || sec.part !== "postgame";
  const zoneVisible = (zone, showSpoilers) => showSpoilers || !zone.spoiler;

  // Nom affiché : nom FR de la ROM ; si plusieurs zones le partagent, on ajoute la précision du nom EN
  // (la partie après « - », ou le nom EN entier s'il n'y en a pas).
  function zoneLabels(zones) {
    const count = {};
    zones.forEach((z) => { count[z.fr] = (count[z.fr] || 0) + 1; });
    const out = {};
    zones.forEach((z) => {
      const detail = z.en.includes(" - ") ? z.en.split(" - ").slice(1).join(" - ") : z.en;
      out[z.id] = count[z.fr] > 1 ? `${z.fr} (${detail})` : z.fr;
    });
    return out;
  }

  function zoneSpeciesIds(zone, showSpoilers) {
    const ids = new Set();
    zone.sections.filter((s) => sectionVisible(s, showSpoilers)).forEach((s) =>
      s.tables.forEach((t) => t.enc.forEach((e) => ids.add(e[0]))));
    return ids;
  }

  function zoneCounts(zone, isCaught, showSpoilers) {
    const ids = zoneSpeciesIds(zone, showSpoilers);
    let caught = 0;
    ids.forEach((id) => { if (isCaught(id)) caught++; });
    return { present: ids.size, caught, remaining: ids.size - caught };
  }

  // opts : { showSpoilers, onlyRemaining }
  function visibleZones(zones, opts, isCaught) {
    return zones.filter((z) => zoneVisible(z, opts.showSpoilers)).map((z) => ({ zone: z, counts: zoneCounts(z, isCaught, opts.showSpoilers) }))
      .filter((r) => !opts.onlyRemaining || r.counts.remaining > 0)
      .sort((a, b) => a.zone.order - b.zone.order);
  }

  const appliesTo = (sec, season) => !sec.seasons || sec.seasons.includes(season);

  // Sections de la zone : celles de la saison courante d'abord, puis les autres (marquées current: false).
  function sectionsForSeason(zone, season, showSpoilers) {
    const secs = zone.sections.filter((s) => sectionVisible(s, showSpoilers));
    const mark = (s, current) => Object.assign({}, s, { current });
    return secs.filter((s) => appliesTo(s, season)).map((s) => mark(s, true))
      .concat(secs.filter((s) => !appliesTo(s, season)).map((s) => mark(s, false)));
  }

  // « Où le trouver » : toutes les rencontres d'une espèce, zones masquées exclues, dans l'ordre de l'aventure.
  function whereToFind(id, zones, showSpoilers) {
    const found = [], grottos = [];
    zones.filter((z) => zoneVisible(z, showSpoilers)).sort((a, b) => a.order - b.order).forEach((z) => {
      z.sections.filter((s) => sectionVisible(s, showSpoilers)).forEach((s) => s.tables.forEach((t) => t.enc.forEach((e) => {
        if (e[0] !== id) return;
        found.push({ zone: z, seasons: s.seasons, method: t.method, variant: t.variant, form: e[1], min: e[2], max: e[3], rate: e[4], event: e[5] });
      })));
      (z.grottos || []).forEach((g) => {
        ["common", "uncommon", "rare"].forEach((tier) => {
          if (g[tier].some((e) => e[0] === id)) grottos.push({ zone: z, grotto: g.name, tier });
        });
      });
    });
    return { found, grottos };
  }

  const levelText = (min, max) => (min === max ? `Niv. ${min}` : `Niv. ${min}–${max}`);
  const seasonsText = (seasons) => (!seasons ? "Toute l'année" : seasons.map((s) => SEASON_FR[s] || s).join(", "));

  // --- Corrections manuelles : export / import JSON --------------------------------------------
  const FORMAT = "bb2-corrections";

  function exportCorrections(manual, showSpoilers) {
    return JSON.stringify({ format: FORMAT, version: 1, showSpoilers: !!showSpoilers, manual }, null, 1);
  }

  // Lève une Error au message clair si le fichier n'est pas une sauvegarde de corrections.
  function importCorrections(text) {
    let o;
    try { o = JSON.parse(text); } catch (e) { throw new Error("Ce fichier n'est pas du JSON valide."); }
    if (!o || o.format !== FORMAT) throw new Error("Ce fichier n'est pas une sauvegarde de corrections de cette page.");
    if (o.version !== 1) throw new Error(`Version ${o.version} non gérée.`);
    const manual = {};
    for (const [k, v] of Object.entries(o.manual || {})) {
      const id = Number(k);
      if (!Number.isInteger(id) || id < 1 || id > 649 || typeof v !== "boolean") {
        throw new Error(`Correction invalide : « ${k} » : ${JSON.stringify(v)}.`);
      }
      manual[id] = v;
    }
    return { manual, showSpoilers: !!o.showSpoilers };
  }

  const api = {
    SEASONS, SEASON_FR, STAT_LABELS, METHOD_FR, normalize, seasonForDate, captureInfo, setManual, manualState,
    filterSpecies, zoneLabels, zoneSpeciesIds, zoneCounts, visibleZones, sectionsForSeason, whereToFind,
    levelText, seasonsText, exportCorrections, importCorrections,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.BB2Logic = api;
})(typeof self !== "undefined" ? self : this);

</script>
<script>
// Simulateur d'IV : formule des stats de la 5e génération inversée. EVs toujours à 0 (EVless).
// Fonctions pures, sans accès au DOM : même code dans Node (tests) et dans le navigateur.
// Les stats suivent l'ordre des données : PV, Atq, Déf, AtqS, DéfS, Vit (indices 0 à 5).
(function (root) {
  "use strict";

  // Ordre des natures dans le jeu : 5 × (stat qui monte) + (stat qui baisse), stats dans l'ordre Atq, Déf, Vit, AtqS, DéfS.
  // Exprimé en indices de stat de nos données.
  const NATURE_STATS = [1, 2, 5, 3, 4];
  const NATURE_COUNT = 25;
  const STAT_LABELS = ["PV", "Atq", "Déf", "AtqS", "DéfS", "Vit"];

  // Types de Puissance Cachée selon les règles de la 5e génération : poids de la parité de chaque IV,
  // dans l'ordre des données (PV, Atq, Déf, AtqS, DéfS, Vit). Normal et Fée sont impossibles.
  // Move Changes ne modifie pas la Puissance Cachée : ces règles s'appliquent à Redux.
  const HP_WEIGHTS = [1, 2, 4, 16, 32, 8];
  const HP_TYPES = ["Combat", "Vol", "Poison", "Sol", "Roche", "Insecte", "Spectre", "Acier",
    "Feu", "Eau", "Plante", "Électrik", "Psy", "Glace", "Dragon", "Ténèbres"];

  // Pourcentage de la nature sur la stat i : 110, 100 ou 90.
  function naturePercent(nature, i) {
    if (!Number.isInteger(nature) || nature < 0 || nature >= NATURE_COUNT) throw new Error(`Nature inconnue : ${nature}`);
    const up = NATURE_STATS[Math.floor(nature / 5)], down = NATURE_STATS[nature % 5];
    if (up === down) return 100;
    return i === up ? 110 : i === down ? 90 : 100;
  }

  // Stat affichée pour un IV donné (EV = 0).
  function statValue(i, base, iv, level, nature) {
    const core = Math.floor(((2 * base + iv) * level) / 100);
    if (i === 0) return core + level + 10;
    return Math.floor(((core + 5) * naturePercent(nature, i)) / 100);
  }

  // IVs (0 à 31) qui donnent la valeur observée ; la formule est croissante, donc l'ensemble est un intervalle.
  // Renvoie { min, max } ou null si aucun IV ne convient.
  function ivRange(i, base, level, nature, observed) {
    let min = -1, max = -1;
    for (let iv = 0; iv <= 31; iv++) {
      if (statValue(i, base, iv, level, nature) === observed) {
        if (min < 0) min = iv;
        max = iv;
      }
    }
    return min < 0 ? null : { min, max };
  }

  function checkReading(r, n) {
    if (!Number.isInteger(r.level) || r.level < 1 || r.level > 100) throw new Error(`Niveau invalide (relevé ${n + 1}) : 1 à 100.`);
    if (!Array.isArray(r.stats) || r.stats.length !== 6 || r.stats.some((v) => !Number.isInteger(v) || v < 1)) {
      throw new Error(`Stats invalides (relevé ${n + 1}) : 6 nombres entiers positifs.`);
    }
  }

  // base : 6 stats de base ; nature : 0 à 24 ; readings : [{ level, stats: [6] }].
  // Renvoie { ranges: [{min,max} | null] ×6, problems: [texte], ok, hiddenPower: [types] }.
  // Chaque relevé donne une fourchette par stat ; les fourchettes des relevés sont croisées.
  function solve(base, nature, readings) {
    if (!Array.isArray(base) || base.length !== 6) throw new Error("Stats de base manquantes.");
    if (!readings.length) throw new Error("Aucun relevé.");
    readings.forEach(checkReading);
    const problems = [];
    const ranges = [];
    for (let i = 0; i < 6; i++) {
      let lo = 0, hi = 31, empty = false;
      readings.forEach((r, n) => {
        const one = ivRange(i, base[i], r.level, nature, r.stats[i]);
        if (!one) {
          problems.push(`${STAT_LABELS[i]} = ${r.stats[i]} est impossible au niveau ${r.level}${readings.length > 1 ? ` (relevé ${n + 1})` : ""} : ` +
            "vérifiez la nature, la forme et la saisie.");
          empty = true;

<script>
const L = BB2Logic, SIM = BB2Sim;
const DATA = JSON.parse(document.getElementById("data").textContent);
const SPECIES = new Map(DATA.species.map((s) => [s.id, s]));
const LABELS = L.zoneLabels(DATA.zones);
const TYPES = [...new Set(DATA.species.flatMap((s) => s.types))].sort((a, b) => a.localeCompare(b, "fr"));
const KEY = "bb2_state_v1";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- État : sauvegarde importée, corrections et réglages gardés dans le navigateur -----------
const S = { tab: "dex", save: null, manual: {}, showSpoilers: false, season: "auto", storage: true,
  dex: { query: "", type: "", caught: "all", sort: "id", desc: false }, onlyRemaining: false };

function loadState() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || "null");
    if (o) { S.save = o.save || null; S.manual = o.manual || {}; S.showSpoilers = !!o.showSpoilers; S.season = o.season || "auto"; }
  } catch (e) { S.storage = false; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ save: S.save, manual: S.manual, showSpoilers: S.showSpoilers, season: S.season })); S.storage = true; }
  catch (e) { S.storage = false; }
}

const isCaught = (id) => L.captureInfo(id, S.save, S.manual).caught;
const currentSeason = () => (S.season === "auto" ? L.seasonForDate(new Date()) : S.season);
const nameOf = (id) => (SPECIES.get(id) ? SPECIES.get(id).fr : "#" + id);

function mark(id) {
  const c = L.captureInfo(id, S.save, S.manual);
  if (c.caught) return c.origin === "save" ? '<span class="mark save" title="Capturé (sauvegarde)">✓</span>' : '<span class="mark manual" title="Capturé (à la main)">✓*</span>';
  return c.origin === "manual" ? '<span class="mark miss" title="Non capturé (forcé à la main)">✗*</span>' : '<span class="mark"></span>';
}
const typeChips = (s) => s.types.map((t) => `<span class="chip">${esc(t)}</span>`).join("");

// --- Pokédex --------------------------------------------------------------------------------
function viewDex() {
  const d = S.dex;
  $("view").innerHTML = `
    <div class="bar">
      <input id="q" type="search" placeholder="Rechercher (FR ou EN, sans accents)" value="${esc(d.query)}" style="flex-basis:100%">
      <select id="type"><option value="">Tous les types</option>${TYPES.map((t) => `<option ${d.type === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <select id="caught"><option value="all">Tous</option><option value="caught">Capturés</option><option value="missing">Non capturés</option></select>
      <select id="sort"><option value="id">Tri : numéro</option><option value="total">Tri : total</option>${L.STAT_LABELS.map((l, i) => `<option value="${i}">Tri : ${l}</option>`).join("")}</select>
      <button class="btn" id="desc" aria-pressed="${d.desc}">${d.desc ? "Décroissant" : "Croissant"}</button>
    </div>
    <div class="muted" id="count"></div>
    <div class="card" id="list" style="padding:4px 8px"></div>
    <p class="muted">✓ capturé d'après la sauvegarde · ✓* coché à la main · ✗* forcé « non capturé » à la main.</p>`;
  $("caught").value = d.caught; $("sort").value = String(d.sort);
  const upd = () => { d.query = $("q").value; d.type = $("type").value; d.caught = $("caught").value;
    d.sort = $("sort").value === "id" || $("sort").value === "total" ? $("sort").value : Number($("sort").value); listDex(); };
  ["q", "type", "caught", "sort"].forEach((id) => $(id).addEventListener("input", upd));
  $("desc").addEventListener("click", () => { d.desc = !d.desc; viewDex(); });
  listDex();
}
function listDex() {
  const list = L.filterSpecies(DATA.species, S.dex, isCaught);
  const caught = DATA.species.filter((s) => isCaught(s.id)).length;
  $("count").textContent = `${list.length} affichés · ${caught} / ${DATA.species.length} capturés`;
  $("list").innerHTML = list.map((s) => `<div class="row" data-act="species" data-id="${s.id}">
    <span class="num">${s.id}</span>${mark(s.id)}
    <div class="main"><b>${esc(s.fr)}</b> <span class="muted">${esc(s.en)}</span><div class="sub">${typeChips(s)} ${s.stats.join("/")} · total ${s.total}</div></div></div>`).join("") || '<p class="muted">Aucun résultat.</p>';
}

function openDetail(html) { $("detailBody").innerHTML = html; $("detail").classList.add("open"); $("detail").scrollTop = 0; }
function closeDetail() { $("detail").classList.remove("open"); }
const backBtn = '<button class="btn" data-act="close">← Retour</button>';

function detailSpecies(id) {
  const s = SPECIES.get(id), c = L.captureInfo(id, S.save, S.manual), st = L.manualState(S.manual, id);
  const origin = c.caught ? (c.origin === "save" ? "capturé d'après la sauvegarde" : "capturé (coché à la main)")
    : c.origin === "manual" ? `non capturé (forcé à la main${c.inGame ? " ; la sauvegarde dit capturé" : ""})` : "non capturé";
  const w = L.whereToFind(id, DATA.zones, S.showSpoilers);
  const rows = w.found.map((f) => `<tr><td>${esc(LABELS[f.zone.id])}</td><td>${esc(L.METHOD_FR[f.method] || f.method)}${f.variant && f.variant !== "Normal" ? ` <span class="muted">(${esc(f.variant)})</span>` : ""}</td>
    <td>${esc(L.seasonsText(f.seasons))}</td><td>${esc(L.levelText(f.min, f.max))}${f.form ? ` <span class="muted">(${esc(f.form)})</span>` : ""}</td>
    <td class="r">${f.rate === null ? "—" : f.rate + " %"}${f.event ? ` <span class="chip">${esc(f.event)}</span>` : ""}</td></tr>`).join("");
  const tierFr = { common: "commune", uncommon: "peu commune", rare: "rare" };
  const g = w.grottos.map((x) => `<li>${esc(LABELS[x.zone.id])} – Trouée Cachée « ${esc(x.grotto)} » (${tierFr[x.tier]})</li>`).join("");
  openDetail(`${backBtn}
    <h1>#${s.id} ${esc(s.fr)} <span class="muted">${esc(s.en)}</span></h1>
    <div class="card">${typeChips(s)}
      <table style="margin-top:8px"><tr>${L.STAT_LABELS.map((l) => `<th class="r">${l}</th>`).join("")}<th class="r">Total</th></tr>
      <tr>${s.stats.map((v) => `<td class="r">${v}</td>`).join("")}<td class="r"><b>${s.total}</b></td></tr></table></div>
    <div class="card"><b>Capture</b> : ${origin}
      <div class="seg" style="margin-top:8px" data-id="${id}">
        ${[["auto", "Auto"], ["caught", "Capturé"], ["missing", "Non capturé"]].map(([v, t]) => `<button data-act="manual" data-state="${v}" aria-pressed="${st === v}">${t}</button>`).join("")}
      </div><div class="muted">« Auto » suit la sauvegarde ; les deux autres choix sont des corrections manuelles.</div></div>
    <h2>Où le trouver</h2>
    ${rows ? `<div class="card" style="overflow-x:auto"><table><tr><th>Zone</th><th>Méthode</th><th>Saison</th><th>Niveau</th><th class="r">Taux</th></tr>${rows}</table></div>` : '<p class="muted">Aucune rencontre sauvage répertoriée (hors zones masquées).</p>'}
    ${g ? `<h3>Trouées Cachées</h3><ul>${g}</ul>` : ""}
    ${S.showSpoilers ? "" : '<p class="muted">Les zones de fin de partie sont masquées (réglage dans « Réglages »).</p>'}`);
}

// --- Zones ----------------------------------------------------------------------------------
function viewZones() {
  const season = currentSeason();
  $("view").innerHTML = `
    <div class="bar">
      <select id="season">${[["auto", `Saison : automatique (${L.SEASON_FR[L.seasonForDate(new Date())]})`], ...L.SEASONS.map((x) => [x, "Saison : " + L.SEASON_FR[x]])].map(([v, t]) => `<option value="${v}" ${S.season === v ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <label class="chk"><input type="checkbox" id="rem" ${S.onlyRemaining ? "checked" : ""}> Reste à capturer</label>
    </div>
    <div class="card" id="zlist" style="padding:4px 8px"></div>
    <p class="muted">Compteur = espèces différentes rencontrées dans la zone (Trouées Cachées non comptées). Saison actuelle : ${esc(L.SEASON_FR[season])}.</p>`;
  $("season").addEventListener("input", () => { S.season = $("season").value; persist(); viewZones(); });
  $("rem").addEventListener("input", () => { S.onlyRemaining = $("rem").checked; listZones(); });
  listZones();
}
function listZones() {
  const rows = L.visibleZones(DATA.zones, { showSpoilers: S.showSpoilers, onlyRemaining: S.onlyRemaining }, isCaught);
  $("zlist").innerHTML = rows.map(({ zone, counts }) => `<div class="row" data-act="zone" data-id="${zone.id}">
    <div class="main"><b>${esc(LABELS[zone.id])}</b> <span class="muted">${esc(zone.en)}</span>
    <div class="prog"><i style="width:${counts.present ? Math.round(100 * counts.caught / counts.present) : 0}%"></i></div></div>
    <span class="${counts.remaining ? "" : "ok"}"><b>${counts.caught}/${counts.present}</b></span></div>`).join("") || '<p class="muted">Aucune zone à afficher.</p>';
}

function detailZone(id) {
  const zone = DATA.zones.find((z) => z.id === id), season = currentSeason();
  const secs = L.sectionsForSeason(zone, season, S.showSpoilers);
  const table = (sec) => sec.tables.map((t) => `<h3>${esc(L.METHOD_FR[t.method] || t.method)}${t.variant && t.variant !== "Normal" ? ` <span class="muted">(${esc(t.variant)})</span>` : ""}</h3>
    ${t.notes.map((n) => `<div class="muted">${esc(n)}</div>`).join("")}
    <table><tr><th></th><th>Pokémon</th><th>Niveau</th><th class="r">Taux</th></tr>
    ${t.enc.map((e) => `<tr><td>${mark(e[0])}</td><td><a class="link" data-act="species" data-id="${e[0]}">${esc(nameOf(e[0]))}</a>${e[1] ? ` <span class="muted">(${esc(e[1])})</span>` : ""}</td>
      <td>${esc(L.levelText(e[2], e[3]))}</td><td class="r">${e[4] === null ? "—" : e[4] + " %"}${e[5] ? ` <span class="chip">${esc(e[5])}</span>` : ""}</td></tr>`).join("")}</table>`).join("");
  const block = (sec) => `<div class="card"><b>${esc(L.seasonsText(sec.seasons))}</b>${sec.part === "postgame" ? ' <span class="chip">après la Ligue</span>' : ""}${table(sec)}</div>`;
  const cur = secs.filter((s) => s.current), oth = secs.filter((s) => !s.current);
  const tierFr = { common: "Commune", uncommon: "Peu commune", rare: "Rare" };
  const grottos = zone.grottos.map((g) => `<div class="card"><b>Trouée Cachée : ${esc(g.name)}</b>
    ${g.notes.map((n) => `<div class="muted">${esc(n)}</div>`).join("")}
    ${["common", "uncommon", "rare"].map((k) => g[k].length ? `<div>${tierFr[k]} : ${g[k].map((e) => `<a class="link" data-act="species" data-id="${e[0]}">${esc(nameOf(e[0]))}</a>${isCaught(e[0]) ? " ✓" : ""}`).join(", ")}</div>` : "").join("")}</div>`).join("");
  const counts = L.zoneCounts(zone, isCaught, S.showSpoilers);
  openDetail(`${backBtn}
    <h1>${esc(LABELS[zone.id])} <span class="muted">${esc(zone.en)}</span></h1>
    <p>${counts.caught} / ${counts.present} capturés · saison actuelle : <b>${esc(L.SEASON_FR[season])}</b></p>
    ${cur.map(block).join("") || '<p class="muted">Aucune rencontre répertoriée pour cette saison.</p>'}
    ${oth.length ? `<details><summary>Autres saisons (${oth.length})</summary>${oth.map(block).join("")}</details>` : ""}
    ${grottos}`);
}

// --- Sauvegarde -----------------------------------------------------------------------------
function viewSave() {
  const sv = S.save;
  const rows = (list, kind) => list.map((p, n) => `<tr><td>${p.box ? "B" + p.box + "-" + p.slot : ""}</td><td>#${p.species} ${esc(nameOf(p.species))}${p.nickname && p.nickname !== nameOf(p.species) ? ` <span class="muted">« ${esc(p.nickname)} »</span>` : ""}</td>
    <td>${p.level ?? ""}</td><td>${esc(p.natureName)}</td><td>${BB2.STAT_KEYS.map((k) => p.ivs[k]).join("/")}</td><td>${p.stats ? BB2.STAT_KEYS.map((k) => p.stats[k]).join("/") : ""}</td>
    <td><button class="btn" data-act="check" data-kind="${kind}" data-n="${n}">Vérifier</button></td></tr>`).join("");
  const head = "<tr><th></th><th>Espèce</th><th>Niv.</th><th>Nature</th><th>IV PV/Atq/Déf/Vit/AtqS/DéfS</th><th>Stats</th><th></th></tr>";
  $("view").innerHTML = `
    <div class="card"><b>Importer le .dsv de DraStic</b><br><input type="file" id="file" style="margin-top:8px; width:100%">
      <div class="muted">Le fichier est lu sur cet appareil, il n'est envoyé nulle part.</div><div id="err" class="ko"></div></div>
    ${sv ? `<div class="card"><b>${esc(sv.trainer)}</b> – ${esc(sv.name)}<br>
      <span class="muted">Importé le ${esc(new Date(sv.importedAt).toLocaleString("fr-FR"))}${sv.fileModified ? " · fichier modifié le " + esc(new Date(sv.fileModified).toLocaleString("fr-FR")) : ""}</span>
      <p class="ok" style="margin:6px 0"><b>${sv.caught.length}</b> espèces capturées</p>
      ${sv.invalid ? `<p class="ko">${sv.invalid} Pokémon avec somme de contrôle invalide.</p>` : ""}</div>
      <h2>Équipe (${sv.party.length})</h2><div class="card" style="overflow-x:auto"><table>${head}${rows(sv.party, "party")}</table></div>
      <h2>Boîtes (${sv.boxes.length})</h2><div class="card" style="overflow-x:auto"><table>${head}${rows(sv.boxes, "boxes")}</table></div>
      <p class="muted">« Vérifier » ouvre le simulateur prérempli : la fourchette calculée doit contenir les IVs lus dans la sauvegarde. Les Pokémon des boîtes n'ont ni niveau ni stats dans le fichier : à saisir.</p>`
      : '<p class="muted">Aucune sauvegarde importée.</p>'}`;
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const r = BB2.parseSave(new Uint8Array(await f.arrayBuffer()));
      S.save = { name: f.name, fileModified: f.lastModified || null, importedAt: new Date().toISOString(), trainer: r.trainer,
        caught: r.caught.filter((n) => n <= DATA.species.length), party: r.party, boxes: r.boxes, invalid: r.invalid };
      persist(); viewSave();
    } catch (err) { $("err").textContent = err.message; }
  });
}

// --- Simulateur d'IV ------------------------------------------------------------------------
const SAVE_KEYS = ["pv", "atq", "def", "atqs", "defs", "vit"]; // ordre des données -> clés de la sauvegarde
const newReading = () => ({ level: "", stats: ["", "", "", "", "", ""] });
const freshSim = () => ({ id: null, form: "", nature: 6, readings: [newReading()], check: null, note: "" });
S.sim = freshSim();

const natureLabel = (n) => {
  const up = [1, 2, 3, 4, 5].find((i) => SIM.naturePercent(n, i) === 110), down = [1, 2, 3, 4, 5].find((i) => SIM.naturePercent(n, i) === 90);
  return up ? `${BB2.NATURES[n]} (+${L.STAT_LABELS[up]} −${L.STAT_LABELS[down]})` : `${BB2.NATURES[n]} (neutre)`;
};

// Espèce saisie : « 16 », « #16 Roucool », « Roucool » ou « Pidgey ».
function resolveSpecies(text) {
  const t = L.normalize(text), m = t.match(/^#?(\d+)/);
  if (m && SPECIES.has(Number(m[1]))) return Number(m[1]);
  const s = DATA.species.find((x) => L.normalize(x.fr) === t || L.normalize(x.en) === t);
  return s ? s.id : null;
}
const simBase = () => {
  const s = SPECIES.get(S.sim.id);
  if (!s) return null;
  return S.sim.form === "" ? s.stats : s.forms[Number(S.sim.form)].stats;
};

function viewSim() {
  const sm = S.sim, sp = SPECIES.get(sm.id);
  $("view").innerHTML = `
    <div class="card">
      <label class="field"><span>Espèce (nom FR ou EN, ou numéro)</span>
        <input id="simSp" list="spList" autocomplete="off" value="${sp ? esc(sp.id + " " + sp.fr) : ""}" placeholder="Roucool"></label>
      <datalist id="spList">${DATA.species.map((s) => `<option value="${s.id} ${esc(s.fr)}">${esc(s.en)}</option>`).join("")}</datalist>
      <div id="simForm"></div>
      <label class="field"><span>Nature</span>
        <select id="simNat">${BB2.NATURES.map((n, i) => `<option value="${i}" ${sm.nature === i ? "selected" : ""}>${esc(natureLabel(i))}</option>`).join("")}</select></label>
      ${sm.note ? `<div class="muted warn">${esc(sm.note)}</div>` : ""}
    </div>
    ${sm.readings.map((r, n) => `<div class="card" data-reading="${n}">
      <div class="row" style="cursor:default; padding-top:0"><b class="main">Relevé ${n + 1}</b>
        ${sm.readings.length > 1 ? `<button class="btn" data-act="simDel" data-n="${n}">Retirer</button>` : ""}</div>
      <label class="field"><span>Niveau (1 à 100)</span><input type="number" inputmode="numeric" min="1" max="100" data-f="level" value="${esc(r.level)}"></label>
      <div class="grid6">${L.STAT_LABELS.map((l, i) => `<label>${l}<input type="number" inputmode="numeric" min="1" data-f="${i}" value="${esc(r.stats[i])}"></label>`).join("")}</div>
    </div>`).join("")}
    <div class="bar"><button class="btn" data-act="simAdd">+ Ajouter un relevé (autre niveau)</button>
      <button class="btn" data-act="simReset">Tout effacer</button></div>
    <div id="simOut"></div>
    <p class="muted">Stats telles qu'affichées en jeu, EVs à 0. Chaque relevé à un niveau différent resserre les fourchettes. Puissance Cachée : règles de la 5e génération (Redux ne la modifie pas).</p>`;
  fillSimForm();
  $("simSp").addEventListener("input", () => {
    const id = resolveSpecies($("simSp").value);
    if (id !== sm.id) { sm.id = id; sm.form = ""; fillSimForm(); renderSimOut(); }
  });
  $("simNat").addEventListener("input", () => { sm.nature = Number($("simNat").value); renderSimOut(); });
  $("view").querySelectorAll("[data-reading] input").forEach((inp) => inp.addEventListener("input", () => {
    const r = sm.readings[Number(inp.closest("[data-reading]").dataset.reading)], f = inp.dataset.f;
    if (f === "level") r.level = inp.value; else r.stats[Number(f)] = inp.value;
    renderSimOut();
  }));
  renderSimOut();
}

function fillSimForm() {
  const sp = SPECIES.get(S.sim.id);
  const el = $("simForm");
  if (!sp || !sp.forms) { el.innerHTML = ""; return; }
  el.innerHTML = `<label class="field"><span>Forme (stats de base propres)</span><select id="simFormSel"><option value="">Forme de base</option>
    ${sp.forms.map((f, i) => `<option value="${i}" ${S.sim.form === String(i) ? "selected" : ""}>${esc(f.label)}</option>`).join("")}</select></label>`;
  $("simFormSel").addEventListener("input", () => { S.sim.form = $("simFormSel").value; renderSimOut(); });
}

function renderSimOut() {
  const sm = S.sim, out = $("simOut"), base = simBase();
  if (!base) { out.innerHTML = '<p class="muted">Choisissez une espèce de la liste.</p>'; return; }
  const filled = (r) => [r.level, ...r.stats].filter((v) => v !== "").length;
  const complete = sm.readings.map((r, n) => ({ n, r })).filter(({ r }) => filled(r) === 7);
  const partial = sm.readings.map((r, n) => ({ n, r })).filter(({ r }) => filled(r) > 0 && filled(r) < 7);
  const hint = partial.map(({ n }) => `<p class="muted warn">Relevé ${n + 1} incomplet : niveau et 6 stats nécessaires.</p>`).join("");
  if (!complete.length) { out.innerHTML = hint || '<p class="muted">Saisissez le niveau et les 6 stats d\'un relevé.</p>'; return; }
  let res;
  try {
    res = SIM.solve(base, sm.nature, complete.map(({ r }) => ({ level: Number(r.level), stats: r.stats.map(Number) })));
  } catch (e) { out.innerHTML = hint + `<p class="ko">${esc(e.message)}</p>`; return; }
  const rows = res.ranges.map((r, i) => {
    const iv = sm.check ? sm.check[i] : null;
    const verdict = iv === null ? "" : !r ? ` <span class="ko">(sauvegarde : ${iv})</span>`
      : iv >= r.min && iv <= r.max ? ` <span class="ok">✓ sauvegarde : ${iv}</span>` : ` <span class="ko">✗ sauvegarde : ${iv}</span>`;
    return `<tr><td>${L.STAT_LABELS[i]}</td><td class="r muted">${base[i]}</td><td class="r"><b class="${r ? "" : "ko"}">${esc(SIM.rangeText(r))}</b>${verdict}</td></tr>`;
  }).join("");
  const hp = sm.check && res.ok ? SIM.hiddenPowerType(sm.check) : null;
  out.innerHTML = `${hint}<div class="card">
    <h2 style="margin-top:0">Fourchettes d'IV</h2>
    <table><tr><th>Stat</th><th class="r">Base</th><th class="r">IV possibles</th></tr>${rows}</table>
    ${res.problems.map((p) => `<p class="ko">${esc(p)}</p>`).join("")}
    ${res.ok ? `<h3>Puissance Cachée possible (${res.hiddenPower.length})</h3>
      <div>${res.hiddenPower.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      ${hp ? `<div class="muted">Type réel d'après la sauvegarde : <b class="${res.hiddenPower.includes(hp) ? "ok" : "ko"}">${esc(hp)}</b></div>` : ""}` : ""}</div>`;
}

// --- Réglages -------------------------------------------------------------------------------
function viewSettings() {
  const n = Object.keys(S.manual).length;
  $("view").innerHTML = `
    <div class="card"><label class="chk"><input type="checkbox" id="spo" ${S.showSpoilers ? "checked" : ""}> Afficher les zones de fin de partie (spoilers)</label>
      <div class="muted">Masquées par défaut : zones après la Ligue et Trouées Cachées qui s'y trouvent.</div></div>
    <div class="card"><b>Corrections manuelles</b> : ${n}
      <div class="bar" style="margin-top:8px"><button class="btn primary" id="exp">Exporter (JSON)</button>
      <button class="btn" id="impBtn">Importer (JSON)</button><input type="file" id="imp" accept=".json,application/json" hidden></div>
      <div id="msg" class="muted"></div>
      <button class="btn" id="clear" ${n ? "" : "disabled"}>Effacer les corrections</button></div>
    ${S.storage ? "" : '<p class="ko">Le stockage du navigateur est indisponible : rien ne sera conservé après fermeture.</p>'}
    <p class="muted">Les corrections et la dernière sauvegarde importée sont gardées dans ce navigateur. Exportez régulièrement le JSON.</p>`;
  $("spo").addEventListener("input", () => { S.showSpoilers = $("spo").checked; persist(); });
  $("exp").addEventListener("click", () => {
    const blob = new Blob([L.exportCorrections(S.manual, S.showSpoilers)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "bb2-corrections.json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("impBtn").addEventListener("click", () => $("imp").click());
  $("imp").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const r = L.importCorrections(await f.text());
      S.manual = r.manual; S.showSpoilers = r.showSpoilers; persist(); viewSettings();
      $("msg").textContent = `${Object.keys(r.manual).length} corrections importées.`;
    } catch (err) { $("msg").className = "ko"; $("msg").textContent = err.message; }
  });
  $("clear").addEventListener("click", () => { if (confirm("Effacer toutes les corrections manuelles ?")) { S.manual = {}; persist(); viewSettings(); } });
}

// --- Navigation et clics -------------------------------------------------------------------
const VIEWS = { dex: viewDex, zones: viewZones, sim: viewSim, save: viewSave, settings: viewSettings };
function show(tab) {
  S.tab = tab; closeDetail();
  document.querySelectorAll("#nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  VIEWS[tab]();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act], #nav button");
  if (!t) return;
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.act === "close") { closeDetail(); if (S.tab === "dex") listDex(); if (S.tab === "zones") listZones(); }
  else if (t.dataset.act === "species") detailSpecies(Number(t.dataset.id));
  else if (t.dataset.act === "zone") detailZone(t.dataset.id);
  else if (t.dataset.act === "check") {
    const p = S.save[t.dataset.kind][Number(t.dataset.n)];
    S.sim = Object.assign(freshSim(), { id: p.species, nature: p.nature, check: SAVE_KEYS.map((k) => p.ivs[k]),
      readings: [p.stats ? { level: String(p.level), stats: SAVE_KEYS.map((k) => String(p.stats[k])) } : newReading()],
      note: (p.stats ? "" : "Pokémon de boîte : la sauvegarde ne donne ni niveau ni stats, à saisir depuis le résumé du jeu. ")
        + (SPECIES.get(p.species).forms ? "Si ce Pokémon n'a pas sa forme de base, choisissez la forme." : "") });
    show("sim");
  }
  else if (t.dataset.act === "simAdd") { S.sim.readings.push(newReading()); viewSim(); }
  else if (t.dataset.act === "simDel") { S.sim.readings.splice(Number(t.dataset.n), 1); viewSim(); }
  else if (t.dataset.act === "simReset") { S.sim = freshSim(); viewSim(); }
  else if (t.dataset.act === "manual") {
    const sid = Number(t.parentElement.dataset.id);
    S.manual = L.setManual(S.manual, sid, t.dataset.state); persist(); detailSpecies(sid);
  }
});

loadState();
show("dex");
</script>
